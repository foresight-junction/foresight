schema_version = "1.4"

artifacts = [
  { source = "/evidence/finalize.json", service = "unfindable" },
]

[task]
name = "unfindable/s0-mcp-sidecar"
description = "Spike S0: MCP server as a compose sidecar over streamable HTTP"

[agent]
timeout_sec = 300

[verifier]
timeout_sec = 120

[[verifier.collect]]
service = "unfindable"
command = "python /app/collect.py"
timeout_sec = 30

[environment]
build_timeout_sec = 900
cpus = 1
memory_mb = 1024

[[environment.mcp_servers]]
name = "unfindable"
transport = "streamable-http"
url = "http://unfindable:8000/mcp"
