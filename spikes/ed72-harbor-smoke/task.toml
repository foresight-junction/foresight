schema_version = "1.4"

artifacts = [
  { source = "/evidence/report.json", service = "hospital" },
]

[task]
name = "ed72/harbor-smoke"
description = "Verify the three ED-72 MCP calls and separate sidecar evidence"

[agent]
timeout_sec = 300

[verifier]
timeout_sec = 120
environment_mode = "separate"

[[verifier.collect]]
service = "hospital"
command = "python /app/collect.py"
timeout_sec = 30

[environment]
build_timeout_sec = 900
cpus = 1
memory_mb = 1024

[[environment.mcp_servers]]
name = "hospital"
transport = "streamable-http"
url = "http://hospital:8000/mcp"
