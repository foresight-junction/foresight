services:
  main:
    depends_on:
      hospital:
        condition: service_healthy

  hospital:
    build:
      context: .
      dockerfile: hospital/Dockerfile
    expose:
      - "8000"
    environment:
      # In ed72/ the host's ED72_SEED picks the seed (Harbor runs compose with the host environment);
      # ":-" keeps 42 when it is unset or empty. scripts/make_seeds.sh pins a literal in ed72-s<N>.
      ED72_SEED: "${ED72_SEED:-42}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 2s
      timeout: 5s
      retries: 30
