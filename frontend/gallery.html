<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ED-72 Sprite Gallery</title>
    <style>
      html,
      body {
        margin: 0;
        background: #14141c;
        color: #e8e8f0;
        font-family: ui-monospace, monospace;
      }
      header {
        padding: 12px 16px;
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      main {
        overflow-x: auto;
        padding: 0 16px 24px;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
      }
      label {
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ED-72 sprite gallery</h1>
      <label>zoom <select id="zoom"><option>2</option><option>3</option><option selected>4</option><option>6</option><option>8</option></select></label>
      <label><input type="checkbox" id="paused" /> pause</label>
      <span id="stats"></span>
    </header>
    <main><canvas id="gallery"></canvas></main>
    <script type="module" src="/src/gallery.ts"></script>
  </body>
</html>
